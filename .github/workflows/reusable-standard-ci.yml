name: Reusable Standard CI

on:
  workflow_call:
    inputs:
      build_command:
        description: Command used to build or prepare the application
        required: true
        type: string

      unit_test_command:
        description: Command used to run unit tests and generate reports
        required: true
        type: string

      lint_command:
        description: Optional command used for linting or code-quality checks
        required: false
        type: string
        default: ""

      junit_report_path:
        description: Path to the generated JUnit XML report
        required: false
        type: string
        default: reports/junit/results.xml

      cobertura_report_path:
        description: Path to the generated Cobertura XML report
        required: false
        type: string
        default: reports/coverage/cobertura.xml

      coverage_language:
        description: Primary language associated with the coverage report
        required: true
        type: string

      publish_artifact:
        description: Whether the application produces a publishable build artifact
        required: false
        type: boolean
        default: true

      artifact_name:
        description: Name assigned to the uploaded build artifact
        required: false
        type: string
        default: application-package

      artifact_path:
        description: File or directory containing the build output
        required: false
        type: string
        default: dist/**

permissions:
  contents: read
  code-quality: write

jobs:
  standard-ci:
    name: Standard CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Blocking checks
      # -----------------------------------------------------------------------

      - name: Build application
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.unit_test_command }}

      - name: Validate JUnit report
        id: junit
        shell: bash
        env:
          JUNIT_REPORT: ${{ inputs.junit_report_path }}
        run: |
          if [[ ! -f "$JUNIT_REPORT" ]]; then
            echo "::error::JUnit XML report was not found at $JUNIT_REPORT"
            exit 1
          fi

          echo "JUnit report found at $JUNIT_REPORT"

      # -----------------------------------------------------------------------
      # Coverage
      #
      # Company policy:
      #   Minimum coverage: 80%
      #   Advisory through: 2027-01-20
      #
      # These values are intentionally not workflow inputs.
      # The actual percentage and advisory enforcement mode are controlled by
      # the organization-level GitHub code coverage ruleset.
      # -----------------------------------------------------------------------

      - name: Check for coverage report
        id: coverage_report
        shell: bash
        env:
          COVERAGE_REPORT: ${{ inputs.cobertura_report_path }}
        run: |
          if [[ -f "$COVERAGE_REPORT" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "message=Coverage report found at $COVERAGE_REPORT." >> "$GITHUB_OUTPUT"
            echo "Coverage report found at $COVERAGE_REPORT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "message=Coverage report was not found at $COVERAGE_REPORT." >> "$GITHUB_OUTPUT"
            echo "::warning::Coverage report was not found at $COVERAGE_REPORT"
          fi

      - name: Upload coverage to GitHub
        id: coverage_upload
        if: >-
          steps.coverage_report.outputs.available == 'true' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: ${{ inputs.cobertura_report_path }}
          language: ${{ inputs.coverage_language }}
          label: standard-ci

      # -----------------------------------------------------------------------
      # Advisory code-quality check
      # -----------------------------------------------------------------------

      - name: Run code-quality checks
        id: lint
        if: inputs.lint_command != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      # -----------------------------------------------------------------------
      # Evidence and artifacts
      # -----------------------------------------------------------------------

      - name: Upload test evidence
        id: test_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            ${{ inputs.junit_report_path }}
            ${{ inputs.cobertura_report_path }}
          if-no-files-found: warn
          retention-days: 14

      # GitHub Actions storage is being used for the proof of concept.
      # A production implementation can replace this step with the approved
      # Artifactory publishing workflow.
      - name: Publish build artifact
        id: artifact
        if: inputs.publish_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      # -----------------------------------------------------------------------
      # Developer-facing summary
      # -----------------------------------------------------------------------

      - name: Write Standard CI summary
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          JUNIT_RESULT: ${{ steps.junit.outcome }}
          COVERAGE_AVAILABLE: ${{ steps.coverage_report.outputs.available }}
          COVERAGE_MESSAGE: ${{ steps.coverage_report.outputs.message }}
          COVERAGE_UPLOAD_RESULT: ${{ steps.coverage_upload.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
          LINT_CONFIGURED: ${{ inputs.lint_command != '' }}
          PUBLISH_ARTIFACT: ${{ inputs.publish_artifact }}
        run: |
          format_result() {
            case "$1" in
              success)
                echo "Passed"
                ;;
              failure)
                echo "Failed"
                ;;
              skipped|"")
                echo "Not run"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          {
            echo "## Standard CI"
            echo
            echo "- **Build:** $(format_result "$BUILD_RESULT")"
            echo "- **Unit tests:** $(format_result "$TEST_RESULT")"
            echo "- **JUnit evidence:** $(format_result "$JUNIT_RESULT")"

            if [[ "$COVERAGE_AVAILABLE" == "true" ]]; then
              echo "- **Coverage report:** Found"
              echo "- **Coverage upload:** $(format_result "$COVERAGE_UPLOAD_RESULT")"
            else
              echo "- **Coverage report:** ${COVERAGE_MESSAGE:-Not evaluated}"
            fi

            if [[ "$LINT_CONFIGURED" == "true" ]]; then
              echo "- **Code quality:** $(format_result "$LINT_RESULT") — Advisory"
            else
              echo "- **Code quality:** Not configured"
            fi

            if [[ "$PUBLISH_ARTIFACT" == "true" ]]; then
              echo "- **Build artifact:** $(format_result "$ARTIFACT_RESULT")"
            else
              echo "- **Build artifact:** Not applicable"
            fi

            echo
            echo "### Coverage policy"
            echo
            echo "- Minimum coverage: **80%**"
            echo "- Coverage remains advisory through **2027-01-20**"
            echo "- Enforcement is controlled by the organization code coverage ruleset"
          } >> "$GITHUB_STEP_SUMMARY"