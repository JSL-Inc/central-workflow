name: Reusable Standard CI

on:
  workflow_call:
    inputs:
      build_command:
        description: Command used to build or prepare the application
        required: true
        type: string

      unit_test_command:
        description: Command used to run unit tests and generate reports
        required: true
        type: string

      lint_command:
        description: Optional command used for linting or code-quality checks
        required: false
        type: string
        default: ""

      junit_report_path:
        description: Path to the generated JUnit XML report
        required: false
        type: string
        default: reports/junit/results.xml

      cobertura_report_path:
        description: Path to the generated Cobertura XML report
        required: false
        type: string
        default: reports/coverage/cobertura.xml

      coverage_language:
        description: Primary language associated with the coverage report
        required: true
        type: string

      publish_artifact:
        description: Whether the application produces a build artifact
        required: false
        type: boolean
        default: true

      artifact_name:
        description: Name assigned to the uploaded build artifact
        required: false
        type: string
        default: application-package

      artifact_path:
        description: File or directory containing the build output
        required: false
        type: string
        default: dist/**

# Centrally managed company policy.
# These values cannot be changed by consuming repositories.
env:
  COVERAGE_THRESHOLD: "80"
  COVERAGE_ADVISORY_END_DATE: "2027-01-20"

permissions:
  contents: read
  code-quality: write

jobs:
  standard-ci:
    name: Standard CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Blocking checks
      # -----------------------------------------------------------------------

      - name: Build application
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.unit_test_command }}

      - name: Validate JUnit report
        id: junit
        shell: bash
        env:
          JUNIT_REPORT: ${{ inputs.junit_report_path }}
        run: |
          if [[ ! -f "$JUNIT_REPORT" ]]; then
            echo "::error title=Missing test evidence::JUnit XML report was not found at $JUNIT_REPORT"
            exit 1
          fi

          echo "JUnit report found at $JUNIT_REPORT"

      # -----------------------------------------------------------------------
      # Advisory coverage evaluation
      #
      # This step reads the Cobertura report only to provide developer feedback.
      # The organization coverage ruleset remains the authoritative enforcement.
      # -----------------------------------------------------------------------

      - name: Evaluate code coverage
        id: coverage
        shell: bash
        env:
          COVERAGE_REPORT: ${{ inputs.cobertura_report_path }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = os.environ["COVERAGE_REPORT"]
          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          advisory_end_date = os.environ["COVERAGE_ADVISORY_END_DATE"]
          output_file = os.environ["GITHUB_OUTPUT"]

          status = "missing"
          percent = "N/A"
          message = f"Coverage report was not found at {report}."

          if os.path.isfile(report):
              try:
                  root = ET.parse(report).getroot()
                  line_rate = root.attrib.get("line-rate")

                  if line_rate is None:
                      status = "invalid"
                      message = (
                          "Cobertura report is missing the root "
                          "line-rate attribute."
                      )
                  else:
                      coverage = float(line_rate) * 100
                      percent = f"{coverage:.2f}"

                      if coverage >= threshold:
                          status = "pass"
                          message = (
                              f"Coverage is {percent}%, meeting the "
                              f"{threshold:.0f}% target."
                          )
                      else:
                          status = "warning"
                          message = (
                              f"Coverage is {percent}%, below the "
                              f"{threshold:.0f}% target."
                          )

              except Exception as error:
                  status = "invalid"
                  message = f"Coverage report could not be parsed: {error}"

          with open(output_file, "a", encoding="utf-8") as output:
              output.write(f"status={status}\n")
              output.write(f"percent={percent}\n")
              output.write(f"message={message}\n")

          print(message)

          if status != "pass":
              warning = (
                  f"{message} Coverage is advisory through "
                  f"{advisory_end_date}."
              )
              print(f"::warning title=Code coverage::{warning}")
          PY

      - name: Upload coverage to GitHub
        id: coverage_upload
        if: >-
          (steps.coverage.outputs.status == 'pass' ||
           steps.coverage.outputs.status == 'warning') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: ${{ inputs.cobertura_report_path }}
          language: ${{ inputs.coverage_language }}
          label: standard-ci

      - name: Report coverage upload issue
        if: steps.coverage_upload.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Coverage upload::The coverage report was generated but could not be uploaded to GitHub. Coverage remains advisory through $COVERAGE_ADVISORY_END_DATE."

      # -----------------------------------------------------------------------
      # Advisory code-quality checks
      # -----------------------------------------------------------------------

      - name: Run code-quality checks
        id: lint
        if: inputs.lint_command != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Report code-quality warning
        if: inputs.lint_command != '' && steps.lint.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Code quality::The configured code-quality check failed. This check is currently advisory."

      # -----------------------------------------------------------------------
      # Evidence and build artifact
      # -----------------------------------------------------------------------

      - name: Upload test evidence
        id: test_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            ${{ inputs.junit_report_path }}
            ${{ inputs.cobertura_report_path }}
          if-no-files-found: warn
          retention-days: 14

      # GitHub Actions artifact storage is used for this proof of concept.
      # A production version can replace this with the approved Artifactory
      # publishing process.
      - name: Publish build artifact
        id: artifact
        if: inputs.publish_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      # -----------------------------------------------------------------------
      # Developer-facing summary
      # -----------------------------------------------------------------------

      - name: Write Standard CI summary
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          JUNIT_RESULT: ${{ steps.junit.outcome }}

          COVERAGE_STATUS: ${{ steps.coverage.outputs.status }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.percent }}
          COVERAGE_MESSAGE: ${{ steps.coverage.outputs.message }}
          COVERAGE_UPLOAD_RESULT: ${{ steps.coverage_upload.outcome }}

          LINT_RESULT: ${{ steps.lint.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}

          LINT_CONFIGURED: ${{ inputs.lint_command != '' }}
          PUBLISH_ARTIFACT: ${{ inputs.publish_artifact }}
        run: |
          format_result() {
            case "$1" in
              success)
                echo "Passed"
                ;;
              failure)
                echo "Failed"
                ;;
              skipped|"")
                echo "Not run"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          {
            echo "## Standard CI"
            echo
            echo "| Check | Result | Enforcement |"
            echo "|---|---|---|"
            echo "| Build | $(format_result "$BUILD_RESULT") | Blocking |"
            echo "| Unit tests | $(format_result "$TEST_RESULT") | Blocking |"
            echo "| JUnit evidence | $(format_result "$JUNIT_RESULT") | Blocking |"

            if [[ "$COVERAGE_PERCENT" != "N/A" && -n "$COVERAGE_PERCENT" ]]; then
              echo "| Code coverage | ${COVERAGE_PERCENT}% | Advisory |"
            else
              echo "| Code coverage | Not available | Advisory |"
            fi

            if [[ "$LINT_CONFIGURED" == "true" ]]; then
              echo "| Code quality | $(format_result "$LINT_RESULT") | Advisory |"
            else
              echo "| Code quality | Not configured | Advisory |"
            fi

            if [[ "$PUBLISH_ARTIFACT" == "true" ]]; then
              echo "| Build artifact | $(format_result "$ARTIFACT_RESULT") | Blocking |"
            else
              echo "| Build artifact | Not applicable | Not applicable |"
            fi

            echo
            echo "### Coverage details"
            echo
            echo "${COVERAGE_MESSAGE:-Coverage was not evaluated.}"
            echo
            echo "- Required target: **${COVERAGE_THRESHOLD}%**"
            echo "- Advisory through: **${COVERAGE_ADVISORY_END_DATE}**"
            echo "- Coverage ruleset enforcement is managed at the organization level"

            if [[ "$COVERAGE_UPLOAD_RESULT" == "failure" ]]; then
              echo "- GitHub coverage upload: **Failed — advisory**"
            elif [[ "$COVERAGE_UPLOAD_RESULT" == "success" ]]; then
              echo "- GitHub coverage upload: **Successful**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"